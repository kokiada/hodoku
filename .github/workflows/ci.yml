name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチの古い実行はキャンセルして無駄なCI時間を使わない（コスト削減）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / API tests
        run: npm test

      - name: Production build
        run: npm run build:prod

      - name: Smoke test (起動して主要ページ・APIを確認)
        run: npm run smoke

  docker:
    name: docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # イメージが壊れていないかの検証のみ（レジストリへは push しない）
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hodoku-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
