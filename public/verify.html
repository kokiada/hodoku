<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hodoku｜メールアドレスの確認</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/hodoku.css">
<style>
.narrow{max-width:440px;margin:0 auto}
.form{display:grid;gap:20px;margin-top:24px}
.alt{margin-top:20px;font-size:13px;color:var(--fuji-ink);display:grid;gap:6px}
.msg{display:none;margin-top:16px;padding:12px 16px;border-radius:12px;font-size:13px}
.msg.show{display:block}
.msg.ok{background:#ECE8EF;color:var(--sumi)}
.msg.bad{background:var(--suou-wash);color:var(--suou-deep);font-weight:500}
</style>
</head>
<body data-gate="off">
<header class="site-header">
  <a class="logo" href="index.html">Hodoku<small>ほどく</small></a>
  <nav aria-label="メイン"><ul><li><a href="shops.html">店舗をさがす</a></li><li><a href="therapist.html">口コミ</a></li><li><a href="guide.html">ガイド</a></li><li><a href="login.html">ログイン</a></li></ul></nav>
  <button class="menu" aria-label="メニュー" type="button"><span></span></button>
</header>
<main class="wrap"><div class="narrow">
  <div class="page-head"><h1>メールアドレスの確認</h1></div>
  <p id="state" role="status">確認しています…</p>
  <p class="msg" id="msg" role="alert"></p>
  <p style="margin-top:24px"><a class="btn primary" href="login.html" id="next" hidden>ログインする</a></p>
</div></main>
<footer class="site"><div class="in">
  <div><a class="logo" href="index.html">Hodoku<small>ほどく</small></a><p style="margin-top:14px">予約の前に、確かめて選ぶための比較サイト。<br>18歳未満の方はご利用いただけません。</p></div>
  <div><ul><li><a href="legal.html#terms">利用規約</a></li><li><a href="legal.html#privacy">プライバシーポリシー</a></li><li><a href="legal.html#tokushoho">特定商取引法に基づく表記</a></li><li><a href="legal.html#contact">お問い合わせ</a></li></ul>
  <p>© 2026 Hodoku</p></div>
</div></footer>
<script src="assets/hodoku.js"></script>
<script>
const $ = id => document.getElementById(id);
(async () => {
  const token = new URLSearchParams(location.search).get('token');
  if (!token) { $('state').textContent = ''; $('msg').textContent = 'リンクが正しくありません。メールのリンクをもう一度開いてください。'; $('msg').className = 'msg show bad'; return; }
  try { await hodokuApi('/auth/verify', {body: {token}}); $('state').textContent = '登録が完了しました。ログインできます。'; $('next').hidden = false; }
  catch (err) { $('state').textContent = ''; $('msg').textContent = err.message; $('msg').className = 'msg show bad'; }
})();
</script>
</body>
</html>
