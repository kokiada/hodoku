<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hodoku｜ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/hodoku.css">
<style>
.narrow{max-width:440px;margin:0 auto}
.form{display:grid;gap:20px;margin-top:24px}
.alt{margin-top:20px;font-size:13px;color:var(--fuji-ink);display:grid;gap:6px}
.msg{display:none;margin-top:16px;padding:12px 16px;border-radius:12px;font-size:13px}
.msg.show{display:block}
.msg.ok{background:#ECE8EF;color:var(--sumi)}
.msg.bad{background:var(--suou-wash);color:var(--suou-deep);font-weight:500}
</style>
</head>
<body data-gate="off">
<header class="site-header">
  <a class="logo" href="index.html">Hodoku<small>ほどく</small></a>
  <nav aria-label="メイン"><ul><li><a href="people.html">人からさがす</a></li><li><a href="shops.html">店舗からさがす</a></li><li><a href="review.html">口コミを書く</a></li><li><a href="guide.html">ガイド</a></li><li><a href="login.html">ログイン</a></li></ul></nav>
  <button class="menu" aria-label="メニュー" type="button"><span></span></button>
</header>
<main class="wrap"><div class="narrow">
  <div class="page-head"><h1>ログイン</h1></div>
  <form class="form" id="f" novalidate>
    <div><label class="field-l" for="em">メールアドレス</label><input class="input" id="em" type="email" autocomplete="email" required></div>
    <div><label class="field-l" for="pw">パスワード</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn primary block" type="submit" id="go">ログイン</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <div class="alt"><a href="membership.html#signup">はじめての方は会員登録</a><a href="#" id="fg">パスワードを忘れた方</a></div>
</div></main>
<footer class="site"><div class="in">
  <div><a class="logo" href="index.html">Hodoku<small>ほどく</small></a><p style="margin-top:14px">予約の前に、確かめて選ぶための比較サイト。<br>18歳未満の方はご利用いただけません。</p></div>
  <div><ul><li><a href="legal.html#terms">利用規約</a></li><li><a href="legal.html#privacy">プライバシーポリシー</a></li><li><a href="legal.html#operator">運営者情報</a></li><li><a href="legal.html#contact">お問い合わせ</a></li></ul>
  <p>© 2026 Hodoku</p></div>
</div></footer>
<script src="assets/hodoku.js"></script>
<script>
const $ = id => document.getElementById(id), show = (t, ok) => { const m = $('msg'); m.textContent = t; m.className = 'msg show ' + (ok ? 'ok' : 'bad'); };
$('f').addEventListener('submit', async e => {
  e.preventDefault(); const go = $('go'); go.disabled = true;
  try {
    await hodokuApi('/auth/login', {body: {email: $('em').value, password: $('pw').value}});
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && /^\/[\w\-\/.?=&%#]*$/.test(next) && !next.startsWith('//') ? next : '/account';
  } catch (err) { show(err.message, false); go.disabled = false; }
});
$('fg').addEventListener('click', async e => {
  e.preventDefault();
  if (!$('em').value) { show('上の欄にメールアドレスを入力してから、もう一度押してください', false); return; }
  try { await hodokuApi('/auth/request-reset', {body: {email: $('em').value}}); show('登録のあるメールアドレスには、再設定のご案内を送りました。', true); }
  catch (err) { show(err.message, false); }
});
</script>
</body>
</html>
